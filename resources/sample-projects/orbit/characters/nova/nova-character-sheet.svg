<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="novaCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3EA5"/>
      <stop offset="55%" stop-color="#7C5CFC"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="novaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3EA5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF3EA5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#131A2B"/>
  <text x="48" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" fill="#F4EFE6">Nova -- Character Reference Sheet</text>
  <text x="48" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#C9CDD6">Orbit onboarding guide -- a small comet-being of curious light</text>

  <!-- Panel 1: Idle Glow -->
  <g transform="translate(60,140)">
    <rect x="0" y="0" width="340" height="340" rx="28" fill="#1B1F27" stroke="#FFFFFF22" stroke-width="2"/>
    <circle cx="170" cy="170" r="120" fill="url(#novaGlow)"/>
    <ellipse cx="170" cy="170" rx="58" ry="42" fill="url(#novaCore)" opacity="0.25"/>
    <circle cx="170" cy="170" r="34" fill="url(#novaCore)"/>
    <circle cx="150" cy="160" r="6" fill="#131A2B"/>
    <circle cx="192" cy="160" r="6" fill="#131A2B"/>
    <path d="M 152 182 Q 170 192 188 182" stroke="#131A2B" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="228" cy="120" r="6" fill="#FFB020"/>
    <text x="170" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#C9CDD6" text-anchor="middle">Idle Glow</text>
  </g>

  <!-- Panel 2: Excited Trail -->
  <g transform="translate(430,140)">
    <rect x="0" y="0" width="340" height="340" rx="28" fill="#1B1F27" stroke="#FFFFFF22" stroke-width="2"/>
    <ellipse cx="120" cy="200" rx="90" ry="30" fill="url(#novaCore)" opacity="0.20" transform="rotate(-20 120 200)"/>
    <ellipse cx="150" cy="190" rx="60" ry="22" fill="url(#novaCore)" opacity="0.35" transform="rotate(-20 150 190)"/>
    <circle cx="200" cy="170" r="34" fill="url(#novaCore)"/>
    <circle cx="188" cy="160" r="7" fill="#131A2B"/>
    <circle cx="216" cy="156" r="7" fill="#131A2B"/>
    <path d="M 186 182 Q 202 198 220 178" stroke="#131A2B" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="255" cy="110" r="5" fill="#22D3EE"/>
    <circle cx="270" cy="140" r="4" fill="#FF3EA5"/>
    <text x="170" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#C9CDD6" text-anchor="middle">Excited Trail</text>
  </g>

  <!-- Panel 3: Pointing Gesture -->
  <g transform="translate(800,140)">
    <rect x="0" y="0" width="340" height="340" rx="28" fill="#1B1F27" stroke="#FFFFFF22" stroke-width="2"/>
    <circle cx="150" cy="170" r="34" fill="url(#novaCore)"/>
    <circle cx="138" cy="160" r="6" fill="#131A2B"/>
    <circle cx="162" cy="160" r="6" fill="#131A2B"/>
    <path d="M 138 184 Q 150 192 162 184" stroke="#131A2B" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- an elongated ellipse "points" outward -->
    <ellipse cx="235" cy="150" rx="46" ry="12" fill="url(#novaCore)" transform="rotate(-18 235 150)"/>
    <circle cx="278" cy="128" r="8" fill="url(#novaCore)"/>
    <text x="170" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#C9CDD6" text-anchor="middle">Pointing Gesture</text>
  </g>

  <!-- Panel 4: Thinking Pulse -->
  <g transform="translate(1170,140)">
    <rect x="0" y="0" width="340" height="340" rx="28" fill="#1B1F27" stroke="#FFFFFF22" stroke-width="2"/>
    <circle cx="170" cy="180" r="30" fill="url(#novaCore)"/>
    <circle cx="160" cy="172" r="5" fill="#131A2B"/>
    <circle cx="180" cy="172" r="5" fill="#131A2B"/>
    <path d="M 162 192 Q 170 188 178 192" stroke="#131A2B" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="196" cy="130" r="7" fill="#22D3EE" opacity="0.9"/>
    <circle cx="210" cy="108" r="5" fill="#22D3EE" opacity="0.6"/>
    <circle cx="222" cy="88" r="3.5" fill="#22D3EE" opacity="0.4"/>
    <text x="170" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#C9CDD6" text-anchor="middle">Thinking Pulse</text>
  </g>

  <!-- Palette strip -->
  <g transform="translate(60,540)">
    <text x="0" y="0" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#C9CDD6">Core palette</text>
    <circle cx="24" cy="40" r="22" fill="#FF3EA5"/>
    <circle cx="120" cy="40" r="22" fill="#7C5CFC"/>
    <circle cx="216" cy="40" r="22" fill="#22D3EE"/>
    <circle cx="312" cy="40" r="22" fill="#FFB020"/>
    <text x="24" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8892A6" text-anchor="middle">aurora pink</text>
    <text x="120" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8892A6" text-anchor="middle">electric blue</text>
    <text x="216" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8892A6" text-anchor="middle">aurora cyan</text>
    <text x="312" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8892A6" text-anchor="middle">bronze/amber</text>
  </g>

  <g transform="translate(500,540)">
    <text x="0" y="0" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#C9CDD6">Design notes</text>
    <text x="0" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#8892A6">Built entirely from circles and ellipses -- no rigid limbs, no face beyond two dots and a</text>
    <text x="0" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#8892A6">simple curved mouth. Emotion reads through the tail's length/spread and the orbiting dots'</text>
    <text x="0" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#8892A6">position -- never through exaggerated limb poses.</text>
  </g>

  <text x="800" y="880" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8892A6" text-anchor="middle">Aether Studio Suite -- Original sample character art, not a stock asset.</text>
</svg>
