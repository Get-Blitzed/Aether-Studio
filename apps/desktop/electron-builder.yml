appId: com.aetherstudiosuite.desktop
productName: Aether Studio Suite
# npm workspaces hoist `electron` to the repo root's node_modules, so
# electron-builder's own version auto-detection (which only looks in this
# package's local node_modules) fails to find it -- pinning it explicitly
# avoids that "Cannot compute electron version" failure.
electronVersion: 31.7.7
# In an npm workspace, node_modules is one shared, hoisted tree across the
# whole monorepo -- not a private one per package. electron-builder's
# default "install/rebuild production dependencies before packaging" step
# was reinstalling apps/desktop's dependencies as production-only against
# that SAME shared tree, pruning devDependencies (which includes
# electron-builder's own transitive 7zip-bin dependency) out from under
# itself mid-build -- the actual cause of a repeated "ENOENT chmod
# .../7zip-bin/.../7za[.exe]" CI failure that looked like antivirus
# quarantine but wasn't. Disabling it is safe here: this project has zero
# native modules to rebuild (see ARCHITECTURE.md's sql.js/safeStorage/
# adm-zip decisions), so there was never anything for this step to do.
npmRebuild: false
directories:
  output: ../../release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../../resources
    to: resources
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Aether-Studio-Suite-Setup.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Aether Studio Suite
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.video
  artifactName: Aether-Studio-Suite-${arch}.dmg
  # Unsigned by default -- set CSC_LINK/CSC_KEY_PASSWORD (or use
  # electron-builder's Apple ID env vars) to sign + notarize for real
  # distribution. Without those, the dmg still builds but macOS Gatekeeper
  # will warn on first launch. Must be built ON macOS (or a macOS CI
  # runner) -- electron-builder cannot produce a working dmg from Windows.
  hardenedRuntime: true
  gatekeeperAssess: false
asar: true
asarUnpack:
  - "**/node_modules/ffmpeg-static/**"
  - "**/node_modules/ffprobe-static/**"
