name: Build installers

# Builds the Windows (NSIS) and macOS (dmg) installers on their native
# platforms -- electron-builder cannot produce a working macOS dmg from a
# Windows runner (or vice versa for code signing), so this always needs a
# real macos-latest runner for the Mac side, not cross-compilation.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist-script: dist:win
            artifact-glob: release/*.exe
          - os: macos-latest
            dist-script: dist:mac
            artifact-glob: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node version this repo is actually developed and
          # tested against locally (v24) -- CI was previously pinned to
          # Node 20, below what pdfjs-dist (a document-engine dependency)
          # requires (>=22.13.0 || >=24), which printed an EBADENGINE
          # warning on every install.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      # Diagnostic: kept in place to confirm apps/desktop/electron-builder.yml's
      # `npmRebuild: false` (the actual fix -- see its comment) stops
      # electron-builder from pruning devDependencies out of this npm
      # workspace's shared node_modules mid-build, which is what was
      # actually deleting 7zip-bin's binary out from under itself. Two
      # earlier attempts to fix this by disabling/excluding Windows Defender
      # made no difference, which is what pointed at electron-builder's own
      # packaging step instead of antivirus as the real cause.
      - name: Check 7zip-bin binary state
        run: node -e "const fs=require('fs');const p=require('path');const dir=path.join('node_modules','7zip-bin');console.log('7zip-bin contents:');for (const plat of fs.readdirSync(dir)) {const platDir=path.join(dir,plat);if(!fs.statSync(platDir).isDirectory())continue;for (const arch of fs.readdirSync(platDir)) {const archDir=path.join(platDir,arch);if(!fs.statSync(archDir).isDirectory())continue;for (const f of fs.readdirSync(archDir)) {const full=path.join(archDir,f);const st=fs.statSync(full);console.log(full, st.size, 'bytes', 'mode='+st.mode.toString(8));}}}"

      - name: Build installer
        run: npm run ${{ matrix.dist-script }} -w apps/desktop
        env:
          # Only meaningful on the macOS job; harmless if unset on Windows.
          # Set these as repo secrets to produce a signed + notarized dmg
          # instead of an unsigned one (see WINDOWS_BUILD.md / MAC_BUILD.md).
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: aether-studio-suite-${{ matrix.os }}
          path: ${{ matrix.artifact-glob }}
